# Render blueprint — one web service + one managed Postgres database.
services:
  - type: web
    name: skillcrust
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: PGSSLMODE
        value: no-verify
      - key: DATABASE_URL
        fromDatabase:
          name: skillcrust-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: AES_ENCRYPTION_KEY
        sync: false

databases:
  - name: skillcrust-db
    plan: free
