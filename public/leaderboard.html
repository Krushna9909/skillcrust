<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — SuccessRich</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="appShellRoot"></div>

    <main class="app-main">
      <div class="page-head">
        <h1 style="font-size:1.9rem;">Leaderboard</h1>
        <p>Top earners across the platform, by referral income.</p>
      </div>

      <div class="tabs" id="leaderboardTabs">
        <button class="tab-btn is-active" data-window="today" type="button">Today</button>
        <button class="tab-btn" data-window="last7Days" type="button">Last 7 Days</button>
        <button class="tab-btn" data-window="last30Days" type="button">Last 30 Days</button>
        <button class="tab-btn" data-window="allTime" type="button">All Time</button>
      </div>

      <div class="podium" id="leaderboardPodium"></div>

      <div class="table-card">
        <div id="leaderboardTableWrap">
          <p class="empty-state" style="padding:0 22px 22px;">Loading&hellip;</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/app-shell.js"></script>
  <script src="/assets/js/leaderboard.js"></script>
</body>
</html>
