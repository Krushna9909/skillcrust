<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Team — SuccessRich</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body class="report-page">
  <div class="app-shell">
    <div id="appShellRoot"></div>

    <main class="app-main">
      <div class="page-head">
        <h1 style="font-size:1.9rem;">My Team</h1>
        <p>Everyone who joined directly under you &mdash; Level 1 referrals.</p>
      </div>

      <div class="report-toolbar">
        <div class="report-count" id="teamCount">&mdash;</div>
        <div class="report-search">
          <input type="search" id="teamSearch" placeholder="Search name, email, phone or refer code" aria-label="Search team members">
        </div>
      </div>

      <div class="table-card">
        <div id="teamTableWrap">
          <p class="empty-state" style="padding:22px;">Loading&hellip;</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/app-shell.js"></script>
  <script src="/assets/js/my-team.js"></script>
</body>
</html>
