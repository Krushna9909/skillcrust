<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet — SkillCrust</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="appShellRoot"></div>

    <main class="app-main">
      <div class="page-head">
        <h1 style="font-size:1.9rem;">Wallet</h1>
        <p>Your balance, and withdrawals to bank or UPI.</p>
      </div>

      <div class="wallet-balance-card">
        <div class="stat-label">Available balance</div>
        <div class="stat-value" id="walletBalance">₹—</div>
      </div>

      <div id="withdrawMessage"></div>

      <div class="card withdraw-form-card">
        <h2 style="font-size:1.1rem; margin-bottom:16px;">Request a withdrawal</h2>
        <div class="method-toggle" id="methodToggle">
          <button type="button" class="is-active" data-method="bank">Bank Account</button>
          <button type="button" data-method="upi">UPI</button>
        </div>
        <div id="kycHint"></div>
        <form id="withdrawForm" novalidate>
          <div class="field">
            <label for="withdrawAmount">Amount (₹)</label>
            <input type="number" id="withdrawAmount" min="1" step="1" required>
          </div>
          <button type="submit" class="btn btn-primary" id="withdrawSubmitBtn">Request withdrawal</button>
        </form>
      </div>

      <div class="table-card">
        <div class="table-card-head">
          <h2>Withdrawal history</h2>
        </div>
        <div id="withdrawalsTableWrap">
          <p class="empty-state" style="padding:0 22px 22px;">Loading&hellip;</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/app-shell.js"></script>
  <script src="/assets/js/wallet.js"></script>
</body>
</html>
