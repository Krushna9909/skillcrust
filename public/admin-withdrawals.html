<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdrawals — SkillCrust Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body>
  <div class="app-shell">
    <div id="appShellRoot"></div>

    <main class="app-main">
      <div class="page-head">
        <h1 style="font-size:1.9rem;">Withdrawals</h1>
        <p>Approve or reject user withdrawal requests. Approving releases the payout to the provider; rejecting refunds the wallet.</p>
      </div>

      <div class="filter-bar">
        <button class="tab-btn is-active" data-status="all" type="button">All</button>
        <button class="tab-btn" data-status="pending" type="button">Pending approval</button>
        <button class="tab-btn" data-status="paid" type="button">Paid</button>
        <button class="tab-btn" data-status="processing" type="button">Processing</button>
        <button class="tab-btn" data-status="failed" type="button">Failed</button>
      </div>

      <div class="table-card">
        <div id="withdrawalsWrap"><p class="empty-state" style="padding:0 22px 22px;">Loading&hellip;</p></div>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/admin-shell.js"></script>
  <script src="/assets/js/admin-withdrawals.js"></script>
</body>
</html>
